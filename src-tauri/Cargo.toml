[package]
name = "colwerk"
version = "0.0.0"
description = "Desktop shell of Colwerk: window, menus and dialogs around the server sidecar"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
