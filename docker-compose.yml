# Local test databases. Credentials are for local development only.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dbm
      POSTGRES_PASSWORD: dbm
      POSTGRES_DB: dbm
    ports: ['127.0.0.1:55432:5432']
    volumes: ['./docker/init/postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'dbm']
      interval: 2s
      retries: 30

  mariadb:
    image: mariadb:11
    command: ['--innodb-buffer-pool-size=16M']
    environment:
      MARIADB_USER: dbm
      MARIADB_PASSWORD: dbm
      MARIADB_ROOT_PASSWORD: dbm
      MARIADB_DATABASE: dbm
    ports: ['127.0.0.1:53306:3306']
    volumes: ['./docker/init/mariadb.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # no arm64 image; runs via Rosetta/QEMU on Apple Silicon
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Dbm_Passw0rd!'
    ports: ['127.0.0.1:51433:1433']
    healthcheck:
      test: ['CMD-SHELL', "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Dbm_Passw0rd!' -Q 'select 1' -b"]
      interval: 5s
      retries: 40

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql: { condition: service_healthy }
    volumes: ['./docker/init/mssql.sql:/init.sql:ro']
    entrypoint:
      ['/opt/mssql-tools18/bin/sqlcmd', '-C', '-S', 'mssql', '-U', 'sa', '-P', 'Dbm_Passw0rd!', '-b', '-i', '/init.sql']
    restart: 'no'

  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    environment:
      CLICKHOUSE_USER: dbm
      CLICKHOUSE_PASSWORD: dbm
      CLICKHOUSE_DB: dbm
    ports: ['127.0.0.1:58123:8123']
    volumes: ['./docker/init/clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    configs: [{ source: clickhouse-lowmem, target: /etc/clickhouse-server/config.d/lowmem.xml }]
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--user', 'dbm', '--password', 'dbm', '-q', 'select 1']
      interval: 2s
      retries: 30

  # SSH server for the tunnel tests; reaches the other services by their service names.
  openssh:
    image: linuxserver/openssh-server:latest
    environment:
      PASSWORD_ACCESS: 'true'
      USER_NAME: dbm
      USER_PASSWORD: dbm
      PUBLIC_KEY_FILE: /keys/id_ed25519.pub
    ports: ['127.0.0.1:52222:2222']
    # The key pair is for the tests only.
    volumes:
      - ./docker/ssh/id_ed25519.pub:/keys/id_ed25519.pub:ro
      - ./docker/ssh/allow-forwarding.sh:/custom-cont-init.d/allow-forwarding.sh:ro

  # Iceberg REST catalog for the lakehouse tests. The warehouse is a host directory mounted at the same absolute
  # path, so that the catalog (metadata) and DuckDB in the tests (data files) write to the same files.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.0
    environment:
      CATALOG_WAREHOUSE: ${PWD}/.iceberg-warehouse
    ports: ['127.0.0.1:58181:8181']
    volumes: ['./.iceberg-warehouse:${PWD}/.iceberg-warehouse']

configs:
  # Tests only read schema metadata, so drop ClickHouse's system log tables and shrink caches/pools
  # (they otherwise cost ~1 GB RAM and constant background CPU).
  clickhouse-lowmem:
    content: |
      <clickhouse>
        <logger><level>warning</level></logger>
        <mark_cache_size>67108864</mark_cache_size>
        <index_mark_cache_size>0</index_mark_cache_size>
        <uncompressed_cache_size>0</uncompressed_cache_size>
        <background_schedule_pool_size>8</background_schedule_pool_size>
        <background_common_pool_size>2</background_common_pool_size>
        <background_move_pool_size>1</background_move_pool_size>
        <background_fetches_pool_size>1</background_fetches_pool_size>
        <background_buffer_flush_schedule_pool_size>1</background_buffer_flush_schedule_pool_size>
        <background_message_broker_schedule_pool_size>1</background_message_broker_schedule_pool_size>
        <background_distributed_schedule_pool_size>1</background_distributed_schedule_pool_size>
        <asynchronous_metrics_update_period_s>60</asynchronous_metrics_update_period_s>
        <query_log remove="1"/>
        <query_thread_log remove="1"/>
        <query_views_log remove="1"/>
        <query_metric_log remove="1"/>
        <part_log remove="1"/>
        <trace_log remove="1"/>
        <text_log remove="1"/>
        <metric_log remove="1"/>
        <latency_log remove="1"/>
        <error_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <asynchronous_insert_log remove="1"/>
        <processors_profile_log remove="1"/>
        <opentelemetry_span_log remove="1"/>
        <session_log remove="1"/>
        <backup_log remove="1"/>
        <blob_storage_log remove="1"/>
        <s3queue_log remove="1"/>
      </clickhouse>
