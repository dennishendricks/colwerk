name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by deno-lock.yml after it commits deno.lock to a Dependabot PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true
      - run: deno install --frozen --allow-scripts
      - run: deno fmt --check
      - run: deno task lint
      - run: deno task typecheck

  # The desktop shell (src-tauri); its packages are only built for a release.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Started first so the databases initialize while Deno installs and builds.
      - run: docker compose up -d --quiet-pull postgres mariadb mssql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true
      - run: deno install --frozen --allow-scripts
      # Builds `.output` and `dist/colwerk` (the server as a Node single executable), which enable the API and
      # binary tests.
      - run: deno task compile
      - run: docker compose up -d --wait postgres mariadb mssql && docker compose run --rm mssql-init
      - run: deno task test

  # DuckDB's native addon, keychain and native dialogs differ per OS; Linux is covered by `test`. Only on main;
  # the network databases are skipped here.
  platforms:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Keeps LF line endings on Windows, as in the repository.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true
      - run: deno install --frozen --allow-scripts
      - run: deno task compile
      - run: deno task test
