name: Tests

# Runs before every release (called from release.yml) and on demand; not on PRs or pushes to main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Started first so the databases initialize while Bun installs and builds.
      - run: docker compose up -d --quiet-pull postgres mariadb mssql clickhouse
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      # Builds `.output` and `dist/colwerk` (the server as a Bun single-file executable), which enable the API and
      # binary tests.
      - run: bun run compile
      - run: docker compose up -d --wait postgres mariadb mssql clickhouse && docker compose run --rm mssql-init
      - run: bun run test

  # DuckDB's native addon, keychain and native dialogs differ per OS; Linux is covered by `test`. The network
  # databases are skipped here.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Keeps LF line endings on Windows, as in the repository.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run test
