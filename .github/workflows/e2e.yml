name: E2E

# Downloads DuckDB's native library like a packaged build does (launcher/native.ts) on every supported system and
# checks that it is verified, stored once, reused and queried; a tampered download must be rejected. Called by CI and
# the release, and weekly, since the npm registry can change without a change here. The download is never cached.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  duckdb-download:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: no release package for Intel Macs, but `bun run compile` builds one from source.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 300000 ./tests/duckdb-download.test.ts
        env:
          COLWERK_E2E: '1'
          COLWERK_KEYCHAIN: 'off'
