name: E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 300000 ./tests/duckdb-archive.test.ts
        env:
          COLWERK_E2E: '1'
          COLWERK_KEYCHAIN: 'off'
