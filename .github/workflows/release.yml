name: Release

# Started by the tag that `bun run release` pushes. Builds every desktop target on its own system and creates a
# draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Builds and tests every target in one job, so the tests run against the shipped server executable (the sidecar)
  # and nothing is built twice. A failing test on any system stops the release.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # LF line endings on Windows too, so the files shared by all builds (LICENSE) are identical.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # The network databases only run on x64 Linux (no arm64 image of MSSQL); elsewhere their tests are skipped.
      # Started first so they initialize during the build.
      - if: matrix.os == 'ubuntu-latest'
        run: docker compose up -d --quiet-pull postgres mariadb mssql clickhouse
      # Without cache: the release is built only from bun.lock and Cargo.lock, not from a cache written by another run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: dtolnay/rust-toolchain@stable
      # Build dependencies of Tauri on Linux (WebKitGTK, and xdo for the menus).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      # hdiutil sometimes cannot eject the DMG ("Resource busy") because Spotlight or XProtect still holds the
      # mounted image, a known flaw of the GitHub macOS runners.
      - if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off
          sudo pkill -9 XProtect || true
      # Builds the host's target into `dist`.
      # --verbose: shows the output of the bundlers (e.g. NSIS), which Tauri hides otherwise.
      # The signing key signs the update packages for tauri-plugin-updater (public key in tauri.conf.json).
      - run: bun run desktop --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - if: matrix.os == 'ubuntu-latest'
        run: docker compose up -d --wait postgres mariadb mssql clickhouse && docker compose run --rm mssql-init
      # `.output` comes from the build above; the binary tests use the sidecar it built.
      - shell: bash
        run: COLWERK_BINARY="$(ls src-tauri/binaries/colwerk-server-*)" bun run test
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Manifest of the auto update; the app reads it once the release is published.
      # The signatures are embedded in latest.json, so their files are not uploaded.
      - run: |
          bun scripts/update-manifest.ts dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          rm dist/*.sig
      # Software bill of materials (CycloneDX) of both lockfiles: the npm packages of bun.lock without dev
      # dependencies (bundled into the client and the sidecar) and the crates of src-tauri/Cargo.lock. One file for
      # all targets; it lists every crate in Cargo.lock, including those of other systems and build tools.
      - uses: anchore/sbom-action/download-syft@v0
        id: syft
      - name: SBOM
        id: sbom
        run: |
          sbom="dist/Colwerk-${GITHUB_REF_NAME#v}.cdx.json"
          ${{ steps.syft.outputs.cmd }} scan dir:. --exclude './.github/**' --exclude './dist/**' \
            --source-name colwerk --source-version "${GITHUB_REF_NAME#v}" --output "cyclonedx-json=$sbom"
          echo "path=$sbom" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      # Binds the SBOM to the same files (`gh attestation verify --predicate-type https://cyclonedx.org/bom`).
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
          sbom-path: ${{ steps.sbom.outputs.path }}
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Colwerk ${GITHUB_REF_NAME#v}" --generate-notes dist/*
