name: Release

# Started by the tag that `deno task release` pushes. Builds every desktop target on its own system and creates a
# draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # LF line endings on Windows too, so the files shared by all builds (LICENSE) are identical.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # Without cache: the release is built only from deno.lock, not from a cache written by another run.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - run: deno install --frozen --allow-scripts
      # Builds the host's target into `dist`.
      - run: deno task desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Colwerk ${GITHUB_REF_NAME#v}" --generate-notes dist/*
