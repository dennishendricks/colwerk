name: Release

# Started by the tag that `bun run release` pushes. Builds every desktop target on its own system and creates a
# draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # LF line endings on Windows too, so the files shared by all builds (LICENSE) are identical.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      # Without cache: the release is built only from bun.lock and Cargo.lock, not from a cache written by another run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: dtolnay/rust-toolchain@stable
      # Build dependencies of Tauri on Linux (WebKitGTK, and xdo for the menus).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      # Builds the host's target into `dist`.
      # NO_STRIP: the strip bundled with linuxdeploy (AppImage) fails on current ELF files; the binaries are
      # already stripped by Cargo, and the Bun sidecar must not be stripped.
      # --verbose: shows the output of the bundlers (e.g. linuxdeploy), which Tauri hides otherwise.
      - run: bun run desktop --verbose
        env:
          NO_STRIP: true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "Colwerk ${GITHUB_REF_NAME#v}" --generate-notes dist/*
